basePath: /
definitions:
  controllers.ResCode:
    enum:
    - 1000
    - 1001
    - 1002
    - 1003
    - 1004
    - 1005
    - 1006
    - 1007
    - 1008
    - 1009
    - 1010
    - 1011
    format: int64
    type: integer
    x-enum-varnames:
    - CodeSuccess
    - CodeInvalidParam
    - CodeUserExist
    - CodeUserNotExist
    - CodeInvalidPassword
    - CodeServerBusy
    - CodeInvalidAuth
    - CodeNeedLogin
    - CodeStoreRedisFail
    - CodeLoginFailed
    - CodeFetchInfoFailed
    - NotCode
  controllers.ResponseData:
    properties:
      code:
        allOf:
        - $ref: '#/definitions/controllers.ResCode'
        description: Code 业务状态码：1000成功，1001参数错误，1002用户已存在，1003用户不存在，1004密码错误，1005服务繁忙，1006无效令牌，1007需要登录，1009会话被替换，1010获取失败。
      data:
        description: Data 响应数据，nil接口值时省略；包含类型的nil切片可能序列化为null。
      msg:
        description: Msg 成功时为success；失败时为错误字符串，字段校验失败时也可能是字段到错误信息的对象。
    type: object
  models.ApiPostDetail:
    properties:
      author_id:
        example: "0"
        type: string
      author_name:
        type: string
      community:
        $ref: '#/definitions/models.CommunityDetail'
      community_id:
        type: integer
      content:
        type: string
      create_time:
        type: string
      id:
        example: "0"
        type: string
      title:
        type: string
      vote_num:
        type: integer
    type: object
  models.Community:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  models.CommunityDetail:
    properties:
      create_time:
        type: string
      id:
        type: integer
      intro:
        type: string
      name:
        type: string
    type: object
  models.ParamLogin:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  models.ParamPost:
    properties:
      community_id:
        maximum: 4
        minimum: 1
        type: integer
      content:
        type: string
      title:
        type: string
    required:
    - community_id
    - content
    - title
    type: object
  models.ParamSigUp:
    properties:
      password:
        type: string
      repassword:
        type: string
      username:
        type: string
    required:
    - password
    - repassword
    - username
    type: object
host: localhost:8081
info:
  contact:
    email: zed@163.com
    name: zed
  description: 简单的Go练手项目
  title: GoWeb项目
  version: "1.0"
paths:
  /api/v1/community:
    get:
      description: 返回所有社区的ID和名称，社区ID为数字。成功1000；获取失败1010。鉴权失败可能返回1005、1006、1007、1009。
      produces:
      - application/json
      responses:
        "200":
          description: 社区列表；无数据时 data 为[]
          schema:
            allOf:
            - $ref: '#/definitions/controllers.ResponseData'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.Community'
                  type: array
              type: object
      security:
      - ApiKeyAuth: []
      summary: 获取社区列表
      tags:
      - 社区相关接口
  /api/v1/community/{id}:
    get:
      description: 根据社区ID查询名称、介绍和创建时间；intro 为空时省略。成功1000；参数错误1001、获取失败1010。业务错误也返回
        HTTP 200。
      parameters:
      - description: 社区ID，可从社区列表取得，例如1
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 社区详情
          schema:
            allOf:
            - $ref: '#/definitions/controllers.ResponseData'
            - properties:
                data:
                  $ref: '#/definitions/models.CommunityDetail'
              type: object
      security:
      - ApiKeyAuth: []
      summary: 获取社区详情
      tags:
      - 社区相关接口
  /api/v1/login:
    post:
      consumes:
      - application/json
      description: 登录后覆盖 Redis 中该用户的当前会话，旧设备后续访问会失效。返回字段实际拼写为 accessTokne 和 refreshToken，userID
        是字符串。成功1000；参数错误1001、用户不存在1003、密码错误1004、服务繁忙1005。
      parameters:
      - description: 用户名和密码
        in: body
        name: object
        required: true
        schema:
          $ref: '#/definitions/models.ParamLogin'
      produces:
      - application/json
      responses:
        "200":
          description: 登录结果；Authorize 中填写 Bearer 加一个空格再加 accessTokne
          schema:
            allOf:
            - $ref: '#/definitions/controllers.ResponseData'
            - properties:
                data:
                  properties:
                    accessTokne:
                      type: string
                    refreshToken:
                      type: string
                    userID:
                      type: string
                    username:
                      type: string
                  type: object
              type: object
      summary: 用户登录
      tags:
      - 账号与令牌
  /api/v1/post:
    post:
      consumes:
      - application/json
      description: 作者ID从当前 access token 获取，客户端无需提交 author_id。community_id 为JSON数字且当前限制1到4。成功1000，省略data且不返回新帖子ID；参数错误1001、服务繁忙1005。执行会真实写入
        MySQL 和 Redis。
      parameters:
      - description: 帖子信息，community_id、title、content 必填
        in: body
        name: object
        required: true
        schema:
          $ref: '#/definitions/models.ParamPost'
      produces:
      - application/json
      responses:
        "200":
          description: 成功时 code=1000，data 字段省略
          schema:
            $ref: '#/definitions/controllers.ResponseData'
      security:
      - ApiKeyAuth: []
      summary: 创建帖子
      tags:
      - 帖子相关接口
  /api/v1/post/{id}:
    get:
      description: 使用帖子的业务ID，而不是数据库自增行ID。响应 id 和 author_id 为JSON字符串，community_id 为数字，社区信息位于
        community 对象。此接口不查询票数，vote_num 省略。参数错误1001、获取失败1010。
      parameters:
      - description: 帖子业务ID，使用列表返回的 id，例如10000000000000001
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 帖子详情
          schema:
            allOf:
            - $ref: '#/definitions/controllers.ResponseData'
            - properties:
                data:
                  $ref: '#/definitions/models.ApiPostDetail'
              type: object
      security:
      - ApiKeyAuth: []
      summary: 获取帖子详情
      tags:
      - 帖子相关接口
  /api/v1/posts:
    get:
      description: 按创建时间降序排列，仅处理 page、size，不处理 order 或 community_id，也不查询票数。缺省或无法解析的
        page/size 分别回退为1/10；当前没有正数或上限校验。获取失败返回1010。
      parameters:
      - default: 1
        description: 页码，建议大于等于1
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页数量，建议1到100
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 帖子列表；无数据时 data 为[]
          schema:
            allOf:
            - $ref: '#/definitions/controllers.ResponseData'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.ApiPostDetail'
                  type: array
              type: object
      security:
      - ApiKeyAuth: []
      summary: 获取帖子列表（MySQL分页）
      tags:
      - 帖子相关接口
  /api/v1/posts2:
    get:
      description: 根据 Redis 索引排序并查询 MySQL。只有 order=score 时按热度降序，其余值按发布时间降序。community_id
        省略或0查询全部，非0按社区筛选。社区排序结果缓存60秒。vote_num 为赞同票数，值为0时省略。分页数值解析失败返回1001；当前没有正数或上限校验；获取失败1010。
      parameters:
      - default: 1
        description: 页码，建议大于等于1
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页数量，建议1到100；不要传0
        in: query
        name: size
        type: integer
      - default: time
        description: time 按发布时间，score 按热度分数；其他值按时间处理
        in: query
        name: order
        type: string
      - default: 0
        description: 社区ID，0查询全部，非0按社区筛选
        in: query
        name: community_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 帖子列表；Redis无匹配ID时 data 为null
          schema:
            allOf:
            - $ref: '#/definitions/controllers.ResponseData'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.ApiPostDetail'
                  type: array
              type: object
      security:
      - ApiKeyAuth: []
      summary: 获取帖子列表（排序和社区筛选）
      tags:
      - 帖子相关接口
  /api/v1/signup:
    post:
      consumes:
      - application/json
      description: 注册新账号，password 与 repassword 必须相同。业务成功 code=1000；错误也返回 HTTP 200，参数错误1001、用户名已存在1002、服务繁忙1005。成功时省略
        data。
      parameters:
      - description: 注册信息，三个字段均必填
        in: body
        name: object
        required: true
        schema:
          $ref: '#/definitions/models.ParamSigUp'
      produces:
      - application/json
      responses:
        "200":
          description: 通过 code 判断业务结果；msg 可能是错误字符串或字段校验错误对象
          schema:
            $ref: '#/definitions/controllers.ResponseData'
      summary: 用户注册
      tags:
      - 账号与令牌
  /api/v1/vote:
    post:
      consumes:
      - application/json
      description: |-
        JSON示例：{"post_id":"10000000000000001","direction":"1"}
        post_id 必填且不能为0；post_id、direction 都必须是JSON字符串。direction 为"1"赞同、"-1"反对、"0"取消，省略时当前按0处理。用户ID从access token获取。帖子超过7天不能投票。参数错误1001；帖子不存在、重复投票、超过投票期限或存储失败等当前统一返回1005。成功1000且省略data。执行会真实修改投票数据。
      parameters:
      - description: post_id 必填；direction 可省略，取字符串1、0或-1
        in: body
        name: object
        required: true
        schema:
          properties:
            direction:
              type: string
            post_id:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: 通过 code 判断业务结果
          schema:
            $ref: '#/definitions/controllers.ResponseData'
      security:
      - ApiKeyAuth: []
      summary: 帖子投票
      tags:
      - 投票相关接口
  /refresh:
    post:
      consumes:
      - application/json
      description: |-
        JSON示例：{"access_token":"替换为当前会话的access_token","refresh_token":"替换为配对的refresh_token"}
        根路径为 /refresh，不带 /api/v1。access_token 和 refresh_token 均必填且必须配对，使用当前会话的两个令牌。访问令牌未过期时返回原令牌对；只有访问令牌已过期且其他校验有效时才生成新令牌并更新 Redis。成功1000；参数错误1001、令牌校验失败1006。此接口不需要 Authorization。
      parameters:
      - description: 两个字段均必填，值为配对令牌；access_token 允许已过期
        in: body
        name: object
        required: true
        schema:
          properties:
            access_token:
              type: string
            refresh_token:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: 刷新结果；下一次请求使用返回的 access_token
          schema:
            allOf:
            - $ref: '#/definitions/controllers.ResponseData'
            - properties:
                data:
                  properties:
                    access_token:
                      type: string
                    refresh_token:
                      type: string
                  type: object
              type: object
      summary: 刷新令牌
      tags:
      - 账号与令牌
schemes:
- http
securityDefinitions:
  ApiKeyAuth:
    description: 使用访问令牌，值为 Bearer 加一个空格再加 access token；登录响应字段为 data.accessTokne。
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
